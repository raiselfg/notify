[project]
name = "notiback"
version = "0.1.0"
description = "Notification service backend"
requires-python = ">=3.12,<3.13"

dependencies = [
    "alembic",
    "asyncpg",
    "fastapi",
    "pydantic-settings",
    "pwdlib[argon2]",
    "sqlalchemy[asyncio]",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "ruff",
]


[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "ASYNC",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.pyright]
include = [
    "app",
    "tests",
]

exclude = [
    "**/__pycache__",
    ".venv",
    "venv",
    "alembic/versions",
]

typeCheckingMode = "strict"
pythonVersion = "3.12"
